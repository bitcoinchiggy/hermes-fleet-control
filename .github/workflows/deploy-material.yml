# Deployment-contract checks only. A full local suite can also report
# environmental import and offline-install errors; those are not this job.
name: deploy-material

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-material:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Deployment material tests
        run: python -m unittest discover -s tests -p 'test_c08cb1e_deploy_material.py'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Fleet MCP syntax and unit tests
        run: |
          node --check fleet-mcp/index.js
          node --check fleet-mcp/python-bin.js
          node --test fleet-mcp/python-bin.test.js fleet-mcp/origin-env.test.js
