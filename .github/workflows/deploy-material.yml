# Deployment-contract checks only. A full local suite can also report
# environmental import and offline-install errors; those are not this job.
name: deploy-material

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-material:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned PyYAML
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r /dev/stdin <<'EOF'
          PyYAML==6.0.2 \
              --hash=sha256:c70c95198c015b85feafc136515252a261a84561b7b1d51e3384e0655ddf25ab \
              --hash=sha256:ce826d6ef20b1bc864f0a68340c8b3287705cae2f8b4b1d932177dcc76721725 \
              --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5 \
              --hash=sha256:9b22676e8097e9e22e36d6b7bda33190d0d400f345f23d4065d48f4ca7ae0425 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:0833f8694549e586547b576dcfaba4a6b55b9e96098b36cdc7ebefe667dfed48 \
              --hash=sha256:8b9c7197f7cb2738065c481a0461e50ad02f18c78cd75775628afb4d7137fb3b \
              --hash=sha256:ef6107725bd54b262d6dedcc2af448a266975032bc85ef0172c5f059da6325b4 \
              --hash=sha256:7e7401d0de89a9a855c839bc697c079a4af81cf878373abd7dc625847d25cbd8
          EOF

      - name: Deployment material tests
        run: python -m unittest discover -s tests -p 'test_c08cb1e_deploy_material.py'

      - name: Set up Node 22
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Fleet MCP syntax and unit tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup-node.outcome == 'success' }}
        run: |
          node --check fleet-mcp/index.js
          node --check fleet-mcp/python-bin.js
          node --test fleet-mcp/python-bin.test.js fleet-mcp/origin-env.test.js
